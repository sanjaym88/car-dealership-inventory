# Render Blueprint for the FastAPI backend (free plan). The database is hosted on Neon.
# Render prompts for DATABASE_URL when the Blueprint is created; JWT_SECRET is generated automatically.
# Optional: add ADMIN_EMAIL and ADMIN_PASSWORD under the service's Environment tab to create an admin.
services:
  - type: web
    name: car-dealership-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Same start-up as the Docker image: migrate, seed the catalog (adds only what's missing),
    # create an admin if ADMIN_EMAIL and ADMIN_PASSWORD are set in the dashboard, then serve on $PORT.
    startCommand: sh docker-entrypoint.sh
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
