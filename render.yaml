# Render Blueprint for the FastAPI backend (free plan). The database is hosted on Neon.
# Render prompts for DATABASE_URL when the Blueprint is created; JWT_SECRET is generated automatically.
services:
  - type: web
    name: car-dealership-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Apply pending migrations on every deploy, then serve on the port Render assigns.
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
