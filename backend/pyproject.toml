[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["app"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
# pyflakes, pycodestyle, isort, bugbear, pyupgrade, simplify
select = ["F", "E", "W", "I", "B", "UP", "SIM"]
# FastAPI's Depends(...) in default arguments is the framework's idiom, not a bug.
ignore = ["B008"]

[tool.ruff.lint.isort]
# The local alembic/ folder holds migrations; the import is the library.
known-third-party = ["alembic"]
