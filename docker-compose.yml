services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: car
      POSTGRES_PASSWORD: car
      POSTGRES_DB: car
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  # Separate, throwaway database for the test suite
  db_test:
    image: postgres:16
    environment:
      POSTGRES_USER: car
      POSTGRES_PASSWORD: car
      POSTGRES_DB: car_test
    ports: ["5433:5432"]

volumes:
  pgdata:
